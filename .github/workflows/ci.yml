# CI do front: formatação, lint, tipos, testes e build a cada push em main/dev e a cada PR.
# O job "verificar" é o check obrigatório dos rulesets de main e dev.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# Um push novo na mesma branch cancela a verificação anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
