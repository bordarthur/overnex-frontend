# CI do front: formatação, lint, tipos, testes, build e o Worker do Cloudflare (sem publicar) a cada
# push em main/dev e a cada PR. Quem publica é o Cloudflare, pela integração com o GitHub (DEPLOY.md).
# O job "verificar" é o check obrigatório dos rulesets de main e dev.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# Um push novo na mesma branch cancela a verificação anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # monta o Worker do Cloudflare com o dist, sem publicar (pega erro do wrangler.jsonc no PR)
      - run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
